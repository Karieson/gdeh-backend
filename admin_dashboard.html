<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GDEH Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff;
}

/* HEADER */
header {
  background: orange;
  padding: 5px;
  text-align: center;
  color: white;
  position: sticky;
  top: 0;
}

header img {
  width: 60px;
  display: block;
  margin: auto;
}

header h1 {
  margin: 5px 0 0;
  font-size: 18px;
  color: black;
}

/* CONTAINER */
.container {
  padding: 15px;
}

/* FILTER INPUTS */
input {
  padding: 6px;
  border: 1px solid black;
  color: black;
  margin: 5px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th {
  background: orange;
  color: white;
  padding: 8px;
  font-size: 10px;
}

td {
  border: 1px solid #ccc;
  padding: 6px;
  font-size: 12px;
  color: black;
}

/* ACTION BUTTONS */
button {
  background: orange;
  border: none;
  color: white;
  padding: 5px 8px;
  margin: 2px;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  box-shadow: 0 0 8px orange;
}

/* FOOTER */
footer {
  background: black;
  color: orange;
  text-align: center;
  padding: 10px;
  position: fixed;
  bottom: 0;
  width: 100%;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <img src="gdeh_logo.png">
  <h1>GDEH ADMIN DASHBOARD</h1>
</header>

<div class="container">

<input id="search" placeholder="Search student..." onkeyup="filterTable()">
<button onclick="loadData()">Refresh</button>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Course</th>
      <th>County</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="table"></tbody>
</table>

</div>

<footer>
  GDEH Admin Dashboard © All Rights Reserved
</footer>

<script>

let students = [];

//
// 📊 LOAD DATA
//
function loadData() {
  fetch("https://gdeh-database.onrender.com/admin/students")
  .then(res => res.json())
  .then(data => {
    students = data;
    render(data);
  });
}

//
// 🧾 RENDER TABLE
//
function render(data) {
  let html = "";

  data.forEach(s => {
    html += `
      <tr>
        <td>${s.id}</td>
        <td>${s.first_name}</td>
        <td>${s.last_name}</td>
        <td>${s.phone}</td>
        <td>${s.email}</td>
        <td>${s.course}</td>
        <td>${s.county}</td>
        <td>
          <button onclick="edit(${s.id})">Edit</button>
          <button onclick="del(${s.id})">Delete</button>
        </td>
      </tr>
    `;
  });

  table.innerHTML = html;
}

//
// 🗑 DELETE
//
function del(id) {
  fetch(`https://gdeh-database.onrender.com/admin/student/${id}`, {
    method: "DELETE"
  }).then(() => loadData());
}

//
// ✏ EDIT
//
function edit(id) {
  let s = students.find(x => x.id === id);

  let first_name = prompt("First Name", s.first_name);
  let last_name = prompt("Last Name", s.last_name);
  let phone = prompt("Phone", s.phone);
  let email = prompt("Email", s.email);
  let course = prompt("Course", s.course);
  let county = prompt("County", s.county);

  fetch(`https://gdeh-database.onrender.com/admin/student/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      first_name,
      last_name,
      phone,
      email,
      course,
      county
    })
  }).then(() => loadData());
}

//
// 🔍 SEARCH
//
function filterTable() {
  let value = search.value.toLowerCase();

  let filtered = students.filter(s =>
    (s.first_name + s.last_name + s.email + s.course)
    .toLowerCase()
    .includes(value)
  );

  render(filtered);
}

loadData();

</script>

</body>
</html>
