<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GDEH Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* LOGO */
.logo {
  width: 90px;
  margin-bottom: 10px;
}

/* TITLE */
.title {
  font-size: 18px;
  font-weight: bold;
  color: orange;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

/* LOGIN BOX */
.box {
  width: 300px;
  padding: 25px;
  border: 2px solid orange;
  border-radius: 12px;
  box-shadow: 0 0 15px orange;
  text-align: center;
  background: white;
}

label {
  display: block;
  text-align: left;
  font-size: 12px;
  margin-top: 10px;
  color: #333;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid orange;
  border-radius: 6px;
  outline: none;
}

/* BUTTON */
button {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  background: darkorange;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  box-shadow: 0 0 10px orange;
}

#msg {
  font-size: 12px;
  color: red;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- LOGO -->
<img src="gdeh_logo.png" class="logo" alt="GDEH Logo">

<!-- TITLE -->
<div class="title">GDEH ADMIN DASHBOARD</div>

<!-- LOGIN BOX -->
<div class="box">

  <label>Username</label>
  <input id="username" type="text">

  <label>Password</label>
  <input id="password" type="password">

  <button onclick="login()">Login</button>

  <div id="msg"></div>

</div>
<script>
const username = document.getElementById("username").value;
const password = document.getElementById("password").value;
const msg = document.getElementById("msg"); // ✔ FIX ADDED

try {

  const res = await fetch("https://gdeh-database.onrender.com/admin/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  if (res.ok && data.success) {

    msg.style.color = "green";
    msg.innerText = "Login successful... redirecting";

    setTimeout(() => {
      window.location.href = "admin_dashboard.html";
    }, 1000);

  } else {
    msg.style.color = "red";
    msg.innerText = "Invalid login";
  }

} catch (err) {
  console.log(err);
  msg.style.color = "red";
  msg.innerText = "Server error";
}
  </script>

</body>
</html>
